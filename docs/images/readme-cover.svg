<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
<title id="title">Diskly — Know your space.</title>
<desc id="desc">An illustrated dark storage dashboard with disk usage rings, a treemap and local-first messaging. This cover is conceptual artwork, not a product screenshot.</desc>
