[package]
name = "diskly"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["seiya058904"]
repository = "https://github.com/seiya058904/Diskly"
rust-version = "1.82"
description = "A minimal Windows tool that shows what changed on your disks since last time."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
diskghost-core = { path = "../../crates/diskghost-core" }
diskly-core = { path = "../../crates/diskly-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
windows-sys = { version = "0.61", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
