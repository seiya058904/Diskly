<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diskly</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="titlebar" data-tauri-drag-region>
  <span class="brand" data-tauri-drag-region>
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="3.4" opacity=".28"/>
      <path d="M12 3.5a8.5 8.5 0 0 1 8.2 10.7" fill="none" stroke="var(--grew)" stroke-width="3.4" stroke-linecap="round"/>
    </svg>
    Diskly
  </span>
  <span class="window-buttons">
    <button type="button" id="window-minimize" aria-label="最小化">
      <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
    <button type="button" id="window-close" class="close" aria-label="关闭">
      <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7m0-7l-7 7" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
  </span>
</header>
<main id="view" tabindex="-1"></main>
<div id="sheet-layer"></div>
<script src="app.js"></script>
</body>
</html>
