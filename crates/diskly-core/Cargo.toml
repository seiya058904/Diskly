[package]
name = "diskly-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["seiya058904"]
repository = "https://github.com/seiya058904/Diskly"
rust-version = "1.80"
description = "Diskly's thin layer over the Diskghost core: volumes, history, comparison and the report."

[dependencies]
diskghost-core = { path = "../diskghost-core" }
blake3 = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
