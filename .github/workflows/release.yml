name: Release

# Pushing a v* tag builds the downloads into a draft release. Nothing is public
# until someone publishes that draft by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: The tag must match the version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw app/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match version $version" }
      - run: cargo test --workspace
      - run: node --test report/lib.test.js
      - name: Build the downloads
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist -File).FullName --draft --title "Diskly $env:GITHUB_REF_NAME" --generate-notes
